# Runs the next due step of every Insta Agent job, one step per call.
# Needs two repository secrets: APP_URL (the deployed app, e.g. https://automation-xyz.vercel.app)
# and CRON_SECRET (the same value as CRON_SECRET in the Vercel project).
name: Insta Agent tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Ticks never overlap: a second tick waits for the first to finish.
concurrency:
  group: insta-agent-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      # Until both secrets exist, the run ends here as a skip, not a failure, so it does not send an email every 5 minutes.
      - name: Secrets not set yet
        if: env.APP_URL == '' || env.CRON_SECRET == ''
        run: echo "APP_URL and CRON_SECRET repository secrets are not set yet, so no step was run."

      - name: Run the next due step
        if: env.APP_URL != '' && env.CRON_SECRET != ''
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 290 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/tick"
          echo
